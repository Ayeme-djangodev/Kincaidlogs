<a href="{{ href }}"
   class="
   inline-flex
   items-center
   justify-center
   rounded-xl
   px-6
   py-3
   font-semibold
   transition
   duration-200

   {% if variant == 'primary' %}
        bg-blue-600
        hover:bg-blue-700
        text-white

   {% elif variant == 'secondary' %}

        border
        border-gray-300
        bg-white
        hover:bg-gray-100

   {% endif %}
   ">

{{ text }}

</a>
