{% extends "auth_base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="login-header">

    <h2>

        Welcome Back

    </h2>

    <p>

        Log in to buy logs.

    </p>

</div>

<div class="ticket-divider"></div>

<form method="post">

    {% csrf_token %}

    <div class="form-group">

        <label>

            Username

        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username">

    </div>

    <div class="form-group">

        <label>

            Password

        </label>

        <input
            type="password"
            name="password"
            placeholder="Password">

    </div>

    <button class="login-btn">

        Sign In

    </button>

</form>

<div class="register-link">

    Don't have an account?

    <a href="{% url 'register' %}">

        Create one

    </a>

</div>

{% endblock %}
