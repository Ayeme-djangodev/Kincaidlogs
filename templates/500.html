{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Went Wrong · KincaidLogs</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="bg-paper font-body text-ink min-h-screen flex items-center justify-center px-6">

    <div class="max-w-md text-center">

        <div class="stamp stamp-lg mx-auto mb-8" style="border-color: var(--color-amber); color: var(--color-amber);">
            <span>ERROR</span>
            <span>500</span>
        </div>

        <h1 class="text-2xl md:text-3xl font-display font-bold text-ink mb-3">
            Something went wrong on our end
        </h1>

        <p class="text-slate">
            We've logged the issue. Please try again in a moment —
            if it persists, reach out to support.
        </p>

        <a href="/"
           class="inline-flex items-center gap-2 mt-8 bg-ledger hover:bg-ledger-dark text-white px-6 py-3 rounded-xl font-display font-medium transition-colors">
            Back to KincaidLogs
        </a>

    </div>

</body>
</html>
